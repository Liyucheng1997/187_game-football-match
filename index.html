<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>热血绿茵 · Blazing Pitch</title>
  <meta name="description" content="街机风格 5v5 3D 足球：热血必杀射门、杯赛生涯、本地多人对战。" />
</head>
<body>
  <div id="app"></div>
  <div id="loadTip"><div class="ld-logo">热血绿茵</div><div class="ld-t">球场准备中……</div></div>

  <!-- 比赛 HUD -->
  <div id="hud" class="hidden">
    <div id="scoreboard">
      <div class="sb-row">
        <div class="sb-team" id="sbA">A</div>
        <div class="sb-score" id="scA">0</div>
        <div class="sb-sep">-</div>
        <div class="sb-score" id="scB">0</div>
        <div class="sb-team" id="sbB">B</div>
        <div id="clock">0'</div>
      </div>
      <div class="fever-row">
        <div class="fever l"><i id="feverA"></i></div>
        <div class="fever-l">🔥</div>
        <div class="fever r"><i id="feverB"></i></div>
      </div>
    </div>
    <div id="tags"></div>
    <div id="radarWrap"><canvas id="radar" width="220" height="142"></canvas></div>
    <div id="commentary"></div>
    <div id="spHint" class="hidden"></div>
    <div id="replayTag" class="hidden"><span class="rec"></span>回放 · 按键跳过</div>
    <div id="shootoutBox" class="hidden"></div>
    <div id="vsCard" class="hidden"></div>
  </div>
  <div id="banner"></div>
  <div id="flashes"></div>
  <div id="fader"></div>
  <div id="toasts"></div>

  <div id="screen" class="hidden"></div>
  <div id="overlay" class="hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
